services:
  db:
    build: ./db          # postgis/postgis + pgRouting (ver db/Dockerfile)
    image: routing-db
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Porta do container é 5432 (usada internamente por backend -> db:5432).
      # Publicada em 5433 no host porque 5432 já está ocupada por outro
      # container nesta máquina. Ajuste para "5432:5432" se liberar a porta.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - routing-net

  # Baixa o extrato do Brasil (Geofabrik) se necessário, importa com osm2pgsql
  # e monta a topologia nacional na primeira subida; nas seguintes detecta que
  # já está tudo no banco e sai em segundos. Nada precisa ser rodado à mão.
  importer:
    build: ./db          # mesma imagem do db: já tem osm2pgsql e cliente psql
    image: routing-db
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: mydatabase
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      OSM2PGSQL_CACHE: ${OSM2PGSQL_CACHE:-2048}
      # URL do extrato do Brasil; usada apenas se o arquivo ainda não existir
      # em ./data/brazil.osm.pbf. Sobrescreva no .env para fixar uma data
      # (ex.: .../brazil-260805.osm.pbf) ou usar um espelho.
      PBF_URL: ${PBF_URL:-https://download.geofabrik.de/south-america/brazil-latest.osm.pbf}
    volumes:
      # Pasta local (versionada vazia no repositório) onde o extrato é salvo.
      # Se você já tem o brazil.osm.pbf, copie-o para ./data/ e o download
      # é pulado.
      - ./data:/data
      - ./db/import/importar_brasil.sh:/importar_brasil.sh:ro
    entrypoint: ["bash", "/importar_brasil.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - routing-net

  backend:
    build: ./backend
    environment:
      DB_HOST: db          # nome do serviço, não localhost
      DB_PORT: "5432"
      DB_NAME: mydatabase
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    networks:
      - routing-net

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - routing-net

volumes:
  db_data:

networks:
  routing-net:
    driver: bridge
